[project]
name = "slides-agent"
version = "0.1.0"
description = "Gerador de Apresentações Corporativas Geoambiente no Google Slides"
authors = [
    {name = "Leonardo Moraes", email = "leonardo.moraes@geoambiente.com.br"},
]

dependencies = [
    "google-adk[gcp,otel-gcp,bigquery-analytics]>=2.8.0,<2.10.0",
    "opentelemetry-resourcedetector-gcp<=1.14.0",
    "gcsfs>=2024.11.0",
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "google-cloud-aiplatform[evaluation,agent-engines]>=1.156.0,<2.0.0",
    "google-api-python-client>=2.0.0",
    "google-genai>=2.0.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.2.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]
requires-python = ">=3.11,<3.14"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "src"]

[tool.pytest.ini_options]
pythonpath = ["."]